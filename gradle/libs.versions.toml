[versions]
agp = "8.8.0"
kotlin = "2.1.0"
composeBom = "2024.12.01"
coroutines = "1.10.1"
serialization = "1.8.0"
datetime = "0.6.1"
atomicfu = "0.26.1"
ktor = "3.0.1"
logback = "1.5.12"
lifecycle = "2.8.7"
navigation = "2.8.5"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
securityCrypto = "1.1.0-alpha06"
wearCompose = "1.4.0"
wearComposeMaterial3 = "1.0.0-alpha30"
